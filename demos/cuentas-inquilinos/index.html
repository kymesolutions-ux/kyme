<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>Cuentas del mes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #074540;
    --brand-dark: #053330;
    --brand-tint: #e8f0ef;
    --ink-950: #171717;
    --ink-900: #222530;
    --ink-700: #2b303b;
    --ink-600: #525866;
    --ink-500: #717784;
    --ink-400: #99a0ae;
    --ink-300: #cacfd8;
    --ink-200: #eaecf0;
    --ink-100: #f2f5f8;
    --ink-50: #f5f7fa;
    --ok: #1fc16b;
    --ok-soft: #e3f7ec;
    --ok-dark: #178c4e;
    --err: #e93544;
    --err-soft: #ffebec;
    --wa: #1daf61;
    --bg: #f4f4f4;
    --display: "Inter Tight", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink-900);
    font: 14px/1.45 "Inter", system-ui, -apple-system, sans-serif;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* Encabezado */
  .top { padding: 22px 0 14px; display: flex; align-items: center; gap: 12px; }
  .top .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-400); }
  .top h1 { margin: 2px 0 0; font: 700 22px/1.15 var(--display); letter-spacing: -.01em; color: var(--ink-950); }
  .month {
    margin-left: auto;
    display: flex; align-items: center;
    background: #fff; border: 1px solid var(--ink-200); border-radius: 10px;
    height: 38px;
  }
  .month button { width: 34px; height: 100%; border: 0; background: none; color: var(--ink-500); display: grid; place-items: center; }
  .month span { font-size: 13px; font-weight: 600; min-width: 74px; text-align: center; color: var(--ink-900); text-transform: capitalize; }

  /* Resumen */
  .card { background: #fff; border: 1px solid var(--ink-200); border-radius: 12px; }
  .summary { padding: 18px; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-400); }
  .big { font: 700 34px/1.1 var(--display); letter-spacing: -.02em; color: var(--ink-950); margin-top: 6px; }
  .meta { color: var(--ink-500); font-size: 13px; margin-top: 4px; }
  .progress { height: 6px; border-radius: 999px; background: var(--ink-100); overflow: hidden; margin-top: 14px; }
  .progress i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .3s; }
  .split { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-500); margin-top: 8px; }
  .split b { color: var(--ink-900); font-weight: 600; }
  [hidden] { display: none !important; }
  .breakdown { display: flex; flex-wrap: wrap; gap: 1px; background: var(--ink-200); border-top: 1px solid var(--ink-200); border-radius: 0 0 12px 12px; overflow: hidden; }
  .breakdown div { flex: 1 1 30%; background: #fff; padding: 10px 12px; }
  .breakdown span { display: block; font-size: 11px; color: var(--ink-500); }
  .breakdown b { font-size: 13px; font-weight: 600; color: var(--ink-900); }

  /* Lista */
  .section { display: flex; align-items: center; justify-content: space-between; margin: 22px 2px 8px; }
  .link-btn { border: 0; background: none; color: var(--brand); font-size: 13px; font-weight: 600; padding: 6px 0; }
  .list { overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px; border: 0; background: none; width: 100%; text-align: left; }
  .item + .item { border-top: 1px solid var(--ink-100); }
  .item:active { background: var(--ink-50); }
  .avatar { width: 38px; height: 38px; border-radius: 999px; background: var(--brand-tint); color: var(--brand); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; color: var(--ink-950); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 12px; color: var(--ink-500); margin-top: 1px; }
  .item .amt { text-align: right; }
  .item .amt b { display: block; font-weight: 600; color: var(--ink-950); }
  .pill { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .04em; padding: 3px 7px; border-radius: 999px; margin-top: 3px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok-dark); }
  .pill.wait { background: var(--ink-100); color: var(--ink-500); }
  .empty { padding: 28px 16px; text-align: center; color: var(--ink-500); }

  .nube { text-align: center; font-size: 11px; color: var(--ink-400); margin-top: 14px; }
  .instalar { display: flex; align-items: center; gap: 12px; padding: 12px; margin-top: 12px; }
  .instalar img { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
  .instalar .t { flex: 1; min-width: 0; }
  .instalar .t b { display: block; font-weight: 600; color: var(--ink-950); font-size: 13px; }
  .instalar .t span { font-size: 12px; color: var(--ink-500); }
  .instalar .btn { height: 36px; padding: 0 14px; font-size: 13px; border-radius: 9px; flex: none; }
  .instalar .x { border: 0; background: none; color: var(--ink-400); width: 28px; height: 28px; display: grid; place-items: center; margin: -4px -4px 0 -6px; align-self: flex-start; }
  .pasos { padding: 12px 14px; margin-top: -4px; border-top: 1px solid var(--ink-100); font-size: 13px; color: var(--ink-700); }
  .pasos ol { margin: 0; padding-left: 18px; }
  .pasos li + li { margin-top: 4px; }
  .pasos b { font-weight: 600; }
  .ghost { width: 100%; margin-top: 10px; height: 46px; border: 1px dashed var(--ink-300); border-radius: 12px; background: transparent; color: var(--ink-600); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }

  /* Barra inferior */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--ink-200); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
  .bar .wrap { display: flex; gap: 10px; }
  .btn { height: 48px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 16px; }
  .btn-primary { background: var(--brand); color: #fff; flex: 1; }
  .btn-primary:active { background: var(--brand-dark); }
  .btn-wa { background: var(--wa); color: #fff; width: 100%; }
  .btn-light { background: #fff; color: var(--ink-700); border-color: var(--ink-200); }
  .btn-danger { background: none; color: var(--err); border-color: transparent; width: 100%; }
  .btn-danger.confirm { background: var(--err-soft); }

  /* Hoja de edición */
  .scrim { position: fixed; inset: 0; background: rgba(23,23,23,.36); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: #fff; border-radius: 18px 18px 0 0; transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); z-index: 11; padding-bottom: env(safe-area-inset-bottom); }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .sheet .wrap { padding-top: 8px; padding-bottom: 18px; }
  .grip { width: 36px; height: 4px; border-radius: 4px; background: var(--ink-200); margin: 0 auto 12px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font: 700 18px/1.2 var(--display); color: var(--ink-950); }
  .close { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--ink-200); background: #fff; color: var(--ink-500); display: grid; place-items: center; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-600); margin-bottom: 6px; }
  .input { width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--ink-200); border-radius: 10px; background: #fff; font-size: 16px; color: var(--ink-900); outline: none; transition: border-color .15s, box-shadow .15s; }
  .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(7,69,64,.15); }

  .concepts { border: 1px solid var(--ink-200); border-radius: 12px; margin: 16px 0 12px; }
  .concept { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; min-height: 58px; }
  .concept + .concept { border-top: 1px solid var(--ink-100); }
  .concept .ico { width: 32px; height: 32px; border-radius: 8px; background: var(--ink-100); color: var(--ink-600); display: grid; place-items: center; flex-shrink: 0; }
  .concept .cname { flex: 1; font-weight: 500; color: var(--ink-900); }
  .concept .money { position: relative; width: 120px; }
  .concept .money span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-400); font-size: 14px; pointer-events: none; }
  .concept .money input { width: 100%; height: 42px; padding: 0 10px 0 30px; text-align: right; border: 1px solid var(--ink-200); border-radius: 9px; font-size: 16px; font-variant-numeric: tabular-nums; outline: none; background: #fff; }
  .concept .money input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(7,69,64,.15); }
  .concept .cname { min-width: 0; }
  .concept .nota { display: block; width: 100%; margin-top: 2px; border: 0; border-bottom: 1px dashed var(--ink-300); padding: 2px 0; font-size: 13px; color: var(--ink-600); outline: none; background: none; }
  .concept .nota:focus { border-bottom-color: var(--brand); }
  .concept .rm { border: 0; background: none; color: var(--ink-400); width: 28px; height: 28px; display: grid; place-items: center; margin-left: -4px; flex-shrink: 0; }
  .concepts-empty { padding: 16px; text-align: center; color: var(--ink-500); font-size: 13px; }
  .chips-label { font-size: 12px; font-weight: 500; color: var(--ink-600); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 10px; border: 1px solid var(--ink-200); border-radius: 999px; background: #fff; color: var(--ink-700); font-size: 13px; font-weight: 500; }
  .chip:active { background: var(--brand-tint); border-color: var(--brand); }
  .chip svg { color: var(--brand); }

  .total-row { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 14px; }
  .total-row b { font: 700 24px var(--display); color: var(--ink-950); letter-spacing: -.01em; }

  .check { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--ink-200); border-radius: 12px; margin-bottom: 10px; }
  .check .t { flex: 1; }
  .check .t b { display: block; font-weight: 600; color: var(--ink-900); }
  .check .t span { font-size: 12px; color: var(--ink-500); }
  .switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; background: var(--ink-300); border-radius: 26px; transition: background .2s; }
  .switch i::after { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
  .switch input:checked + i { background: var(--ok); }
  .switch input:checked + i::after { transform: translateX(18px); }
  .stack { display: grid; gap: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink-950); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Alquileres</div>
      <h1>Cuentas del mes</h1>
    </div>
    <div class="month">
      <button id="prev" aria-label="Mes anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="mes"></span>
      <button id="next" aria-label="Mes siguiente"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </header>

  <section class="card">
    <div class="summary">
      <div class="label">Total a cobrar</div>
      <div class="big" id="total">S/ 0.00</div>
      <div class="meta" id="meta"></div>
      <div class="progress"><i id="bar" style="width:0"></i></div>
      <div class="split"><span>Cobrado <b id="cobrado">S/ 0.00</b></span><span>Pendiente <b id="pendiente">S/ 0.00</b></span></div>
    </div>
    <div class="breakdown" id="breakdown"></div>
  </section>

  <section class="card" id="instalar" hidden>
    <div class="instalar">
      <img src="icon-192.png" alt="">
      <div class="t"><b>Tenlo como app</b><span>Un ícono en tu pantalla de inicio</span></div>
      <button class="btn btn-primary" id="instalarBtn">Agregar</button>
      <button class="x" id="instalarNo" aria-label="Ocultar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="pasos" id="pasos" hidden></div>
  </section>

  <div class="section">
    <div class="label">Inquilinos</div>
    <button class="link-btn" id="copiarMes" hidden>Copiar del mes anterior</button>
  </div>
  <section class="card list" id="lista"></section>
  <button class="ghost" id="agregar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Agregar inquilino
  </button>
  <div class="nube" id="nube">Conectando…</div>
</div>

<div class="bar">
  <div class="wrap">
    <a class="btn btn-primary" id="enviarResumen" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      Enviar resumen
    </a>
  </div>
</div>

<div id="hoja">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hojaTitulo">
    <div class="wrap">
      <div class="grip"></div>
      <div class="sheet-head">
        <h2 id="hojaTitulo">Inquilino</h2>
        <button class="close" id="cerrar" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>

      <div class="field">
        <label for="fNombre">Nombre o habitación</label>
        <input class="input" id="fNombre" type="text" placeholder="Ej: Juan · Cuarto 2" autocomplete="off">
      </div>
      <div class="field">
        <label for="fTel">WhatsApp</label>
        <input class="input" id="fTel" type="tel" inputmode="tel" placeholder="987 654 321" autocomplete="off">
      </div>

      <div class="concepts" id="conceptos"></div>
      <div class="chips-label" id="chipsLabel">Agregar cobro</div>
      <div class="chips" id="chips"></div>

      <div class="total-row"><span class="label">Total del inquilino</span><b id="fTotal">S/ 0.00</b></div>

      <div class="check">
        <div class="t"><b>Ya pagó este mes</b><span>Márcalo cuando te transfiera</span></div>
        <label class="switch"><input type="checkbox" id="fPagado"><i></i></label>
      </div>

      <div class="stack">
        <a class="btn btn-wa" id="fWa" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2c2.6 0 5.1 1 6.9 2.9 1.8 1.8 2.9 4.3 2.9 6.9 0 5.4-4.4 9.8-9.8 9.8zm8.4-18.2C18.1 1.3 15.2.2 12 .2 5.5.2.2 5.5.2 12c0 2.1.5 4.1 1.6 5.9L.1 24l6.3-1.6c1.7.9 3.7 1.4 5.6 1.4 6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.1-3.4-8.4z"/></svg>
          Enviarle su cuenta
        </a>
        <button class="btn btn-danger" id="fBorrar">Eliminar inquilino</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ICONOS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  drop: '<path d="M12 2.7c3.5 4 6 7.3 6 10.3a6 6 0 0 1-12 0c0-3 2.5-6.3 6-10.3z"/>',
  wifi: '<path d="M5 12.6a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/>',
  tv: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="m8 2 4 4 4-4M7 21h10"/>',
  car: '<path d="M5 17h14M5 17v2M19 17v2M3 13l2-6h14l2 6v4H3z"/><circle cx="7.5" cy="14" r=".8" fill="currentColor"/><circle cx="16.5" cy="14" r=".8" fill="currentColor"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  tag: '<path d="M20 12 12 20l-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor"/>',
  flame: '<path d="M12 22c4 0 7-2.7 7-6.5 0-3.8-3-6.2-4-9.5-1.3 1.5-2 3-2 4.5C11 9 9.5 7 9.5 4.5 6.5 7 5 10.5 5 15.5 5 19.3 8 22 12 22z"/>',
};
// "repite": el monto pasa solo al mes siguiente (cobros fijos)
const CONCEPTOS = [
  { key: "alquiler", nombre: "Cuarto",    icono: "home",  repite: true },
  { key: "luz",      nombre: "Luz",       icono: "bolt" },
  { key: "agua",     nombre: "Agua",      icono: "drop" },
  { key: "cable",    nombre: "Cable",     icono: "tv",    repite: true },
  { key: "internet", nombre: "Wifi",      icono: "wifi",  repite: true },
  { key: "gas",      nombre: "Gas",       icono: "flame" },
  { key: "cochera",  nombre: "Cochera",   icono: "car",   repite: true },
  { key: "limpieza", nombre: "Limpieza",  icono: "spark", repite: true },
  { key: "otro",     nombre: "Otro",      icono: "tag" },
];
const nombreCobro = (c, r) => c.key === "otro" && r.nota?.trim() ? r.nota.trim() : c.nombre;
const STORE_KEY = "cuentas-alquiler-v2";
const MONEDA = "S/";

const $ = id => document.getElementById(id);
const svg = (k, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS[k]}</svg>`;

// Estado: inquilinos (datos fijos) + meses ("2026-11" -> { id: { montos, pagado } })
let db = cargar() || { inquilinos: [], meses: {} };
let mesKey = claveMes(new Date());
let editando = null;

function cargar() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; }
}
function guardar() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {}
  if (!nubeLista) return;
  clearTimeout(guardar._t);
  pendiente = true;
  estadoNube("Guardando…");
  guardar._t = setTimeout(subir, 700);
}

// Nube (Supabase): una sola fila con todo el estado. El celular guarda una copia
// local y la nube se sincroniza por detrás.
const NUBE_URL = "https://htpxbdlpttqgwivzoocz.supabase.co/rest/v1/cuentas_alquiler";
const NUBE_KEY = "sb_publishable_jQv9HPnFAzNPIAEQI15y3A_3TFlgmPi";
const NUBE_ID = "principal";
const NUBE_HEADERS = { apikey: NUBE_KEY, Authorization: "Bearer " + NUBE_KEY, "Content-Type": "application/json" };
let nubeLista = false; // no subir nada hasta haber leído la nube
let pendiente = false;

const SYNC_KEY = STORE_KEY + "-sincronizado";

function estadoNube(t) { $("nube").textContent = t; }

// Une dos estados: agrega los inquilinos y meses que falten; si coinciden, gana la nube
function combinar(nube, local) {
  const out = { inquilinos: [...nube.inquilinos], meses: JSON.parse(JSON.stringify(nube.meses || {})) };
  local.inquilinos.forEach(i => { if (!out.inquilinos.some(x => x.id === i.id)) out.inquilinos.push(i); });
  Object.entries(local.meses || {}).forEach(([mes, regs]) => {
    out.meses[mes] = { ...regs, ...(out.meses[mes] || {}) };
  });
  return out;
}

async function bajar() {
  try {
    const r = await fetch(`${NUBE_URL}?id=eq.${NUBE_ID}&select=data`, { headers: NUBE_HEADERS });
    if (!r.ok) throw new Error(r.status);
    const remoto = (await r.json())[0]?.data;
    const tieneDatos = d => d && Array.isArray(d.inquilinos) && (d.inquilinos.length || Object.keys(d.meses || {}).length);
    nubeLista = true;
    // Primera vez en este celular: lo que ya había aquí se suma a la nube, no se pisa
    let primeraVez = true;
    try { primeraVez = !localStorage.getItem(SYNC_KEY); localStorage.setItem(SYNC_KEY, "1"); } catch (e) {}
    if (primeraVez && tieneDatos(db)) {
      try { localStorage.setItem(STORE_KEY + "-respaldo", JSON.stringify(db)); } catch (e) {}
      db = tieneDatos(remoto) ? combinar(remoto, db) : db;
      if (!editando) render();
      guardar();
    } else if (tieneDatos(remoto)) {
      db = remoto;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {}
      if (!editando) render();
      estadoNube("Guardado en la nube");
    } else if (tieneDatos(db)) {
      guardar();
    } else {
      estadoNube("Guardado en la nube");
    }
  } catch (e) {
    estadoNube("Sin conexión · guardado en el celular");
  }
}

async function subir(keepalive) {
  pendiente = false;
  try {
    const r = await fetch(NUBE_URL, {
      method: "POST",
      keepalive: !!keepalive,
      headers: { ...NUBE_HEADERS, Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ id: NUBE_ID, data: db, updated_at: new Date().toISOString() }),
    });
    if (!r.ok) throw new Error(r.status);
    if (!pendiente) estadoNube("Guardado en la nube");
  } catch (e) {
    pendiente = true;
    estadoNube("Sin conexión · guardado en el celular");
  }
}

window.addEventListener("online", () => { nubeLista ? (pendiente && subir()) : bajar(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && pendiente && nubeLista) { clearTimeout(guardar._t); subir(true); }
  if (document.visibilityState === "visible" && !pendiente && !editando) bajar();
});

function claveMes(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function mover(key, delta) {
  const [y, m] = key.split("-").map(Number);
  return claveMes(new Date(y, m - 1 + delta, 1));
}
function nombreMes(key, largo) {
  const [y, m] = key.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("es-PE", { month: largo ? "long" : "short", year: "numeric" }).replace(".", "").replace(" de ", " ");
}

function num(v) { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; }
function fmt(n) { return MONEDA + " " + n.toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function iniciales(s) { return (s || "?").trim().replace(/[^\p{L}\s]/gu, " ").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?"; }

function registro(inq, key = mesKey) {
  const mes = db.meses[key] || (db.meses[key] = {});
  if (!mes[inq.id]) {
    // Nuevo mes: los cobros fijos se repiten, el resto queda en blanco
    const anterior = db.meses[mover(key, -1)]?.[inq.id];
    const montos = {};
    inq.conceptos.forEach(k => {
      const fijo = CONCEPTOS.find(c => c.key === k)?.repite;
      montos[k] = fijo && anterior ? (anterior.montos[k] ?? "") : "";
    });
    mes[inq.id] = { montos, pagado: false };
  }
  return mes[inq.id];
}
function totalDe(inq, key = mesKey) {
  const r = registro(inq, key);
  return inq.conceptos.reduce((s, k) => s + num(r.montos[k]), 0);
}

function telefonoWa(t) {
  let d = (t || "").replace(/\D/g, "");
  if (d.length === 9 && d[0] === "9") d = "51" + d; // celular peruano sin código
  return d;
}
function linkWa(texto, tel) { return `https://wa.me/${telefonoWa(tel)}?text=${encodeURIComponent(texto)}`; }

function textoInquilino(inq) {
  const r = registro(inq);
  const lineas = [`Hola ${inq.nombre.trim().split(/[\s·]/)[0]}, te paso la cuenta de ${nombreMes(mesKey, true)}:`, ""];
  CONCEPTOS.forEach(c => {
    if (inq.conceptos.includes(c.key) && num(r.montos[c.key]) > 0) lineas.push(`• ${nombreCobro(c, r)}: ${fmt(num(r.montos[c.key]))}`);
  });
  lineas.push("", `*Total: ${fmt(totalDe(inq))}*`, "", "Gracias.");
  return lineas.join("\n");
}
function textoResumen() {
  const lineas = [`*Resumen ${nombreMes(mesKey, true)}*`, ""];
  db.inquilinos.forEach(inq => {
    lineas.push(`${inq.nombre || "Sin nombre"}: ${fmt(totalDe(inq))}${registro(inq).pagado ? " ✓" : ""}`);
  });
  const t = db.inquilinos.reduce((s, i) => s + totalDe(i), 0);
  const c = db.inquilinos.filter(i => registro(i).pagado).reduce((s, i) => s + totalDe(i), 0);
  lineas.push("", `*Total: ${fmt(t)}*`, `Cobrado: ${fmt(c)}`, `Pendiente: ${fmt(t - c)}`);
  return lineas.join("\n");
}

function render() {
  $("mes").textContent = nombreMes(mesKey);
  const inqs = db.inquilinos;
  const total = inqs.reduce((s, i) => s + totalDe(i), 0);
  const pagados = inqs.filter(i => registro(i).pagado);
  const cobrado = pagados.reduce((s, i) => s + totalDe(i), 0);

  $("total").textContent = fmt(total);
  $("meta").textContent = inqs.length
    ? `${inqs.length} ${inqs.length === 1 ? "inquilino" : "inquilinos"} · ${pagados.length} ${pagados.length === 1 ? "pagó" : "pagaron"}`
    : "Agrega tu primer inquilino para empezar";
  $("cobrado").textContent = fmt(cobrado);
  $("pendiente").textContent = fmt(total - cobrado);
  $("bar").style.width = total ? (cobrado / total * 100) + "%" : "0";

  const porConcepto = CONCEPTOS.map(c => ({
    c, v: inqs.reduce((s, i) => s + (i.conceptos.includes(c.key) ? num(registro(i).montos[c.key]) : 0), 0),
  })).filter(x => x.v > 0);
  $("breakdown").innerHTML = porConcepto.map(x => `<div><span>${x.c.nombre}</span><b>${fmt(x.v)}</b></div>`).join("");
  $("breakdown").hidden = !porConcepto.length;

  $("lista").innerHTML = inqs.length ? "" : `<div class="empty">Aún no hay inquilinos</div>`;
  inqs.forEach(inq => {
    const r = registro(inq);
    const b = document.createElement("button");
    b.className = "item";
    const conceptos = CONCEPTOS.filter(c => inq.conceptos.includes(c.key)).map(c => c.nombre).join(", ");
    b.innerHTML = `
      <div class="avatar"></div>
      <div class="info"><div class="name"></div><div class="sub"></div></div>
      <div class="amt"><b>${fmt(totalDe(inq))}</b><span class="pill ${r.pagado ? "ok" : "wait"}">${r.pagado ? "PAGADO" : "PENDIENTE"}</span></div>`;
    b.querySelector(".avatar").textContent = iniciales(inq.nombre);
    b.querySelector(".name").textContent = inq.nombre || "Sin nombre";
    b.querySelector(".sub").textContent = conceptos;
    b.onclick = () => abrir(inq);
    $("lista").appendChild(b);
  });

  const mesAnterior = db.meses[mover(mesKey, -1)];
  const vacio = inqs.every(i => !totalDe(i));
  $("copiarMes").hidden = !(inqs.length && vacio && mesAnterior && Object.keys(mesAnterior).length);

  $("enviarResumen").href = linkWa(textoResumen(), "");
  guardar();
}

function abrir(inq) {
  editando = inq;
  const r = registro(inq);
  $("fNombre").value = inq.nombre;
  $("fTel").value = inq.telefono;
  $("fPagado").checked = r.pagado;
  $("fBorrar").classList.remove("confirm");
  $("fBorrar").textContent = "Eliminar inquilino";
  pintarConceptos();
  $("hoja").classList.add("open");
  document.body.style.overflow = "hidden";
}
function cerrar() {
  // Un inquilino nuevo que se deja vacío se descarta
  if (editando && !editando.nombre.trim()) {
    if (!totalDe(editando)) {
      const id = editando.id;
      db.inquilinos = db.inquilinos.filter(i => i.id !== id);
      Object.values(db.meses).forEach(m => delete m[id]);
    } else {
      editando.nombre = "Inquilino " + db.inquilinos.length;
    }
  }
  $("hoja").classList.remove("open");
  document.body.style.overflow = "";
  editando = null;
  render();
}

function pintarConceptos() {
  const inq = editando, r = registro(inq);
  const activos = CONCEPTOS.filter(c => inq.conceptos.includes(c.key));
  const libres = CONCEPTOS.filter(c => !inq.conceptos.includes(c.key));
  const x = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  $("conceptos").innerHTML = activos.length ? activos.map(c => `
      <div class="concept" data-key="${c.key}">
        <div class="ico">${svg(c.icono)}</div>
        <div class="cname">${c.nombre}${c.key === "otro" ? `<input class="nota" type="text" placeholder="¿Qué es? Ej: reparación" autocomplete="off">` : ""}</div>
        <button class="rm" aria-label="Quitar ${c.nombre}">${x}</button>
        <div class="money"><span>${MONEDA}</span><input class="monto" type="text" inputmode="decimal" placeholder="0.00"></div>
      </div>`).join("") : `<div class="concepts-empty">Elige abajo qué se le cobra</div>`;

  $("chips").innerHTML = libres.map(c => `<button class="chip" data-key="${c.key}">${svg(c.icono, 14)}${c.nombre}</button>`).join("");
  $("chips").hidden = $("chipsLabel").hidden = !libres.length;

  $("conceptos").querySelectorAll(".concept").forEach(row => {
    const key = row.dataset.key;
    const monto = row.querySelector(".monto");
    monto.value = r.montos[key] ?? "";
    monto.oninput = () => { r.montos[key] = monto.value; actualizarHoja(); };
    const nota = row.querySelector(".nota");
    if (nota) { nota.value = r.nota || ""; nota.oninput = () => { r.nota = nota.value; actualizarHoja(); }; }
    row.querySelector(".rm").onclick = () => {
      inq.conceptos = inq.conceptos.filter(k => k !== key);
      r.montos[key] = "";
      pintarConceptos();
    };
  });
  $("chips").querySelectorAll(".chip").forEach(chip => {
    const key = chip.dataset.key;
    chip.onclick = () => {
      inq.conceptos = CONCEPTOS.map(c => c.key).filter(k => k === key || inq.conceptos.includes(k));
      if (!(key in r.montos)) r.montos[key] = "";
      pintarConceptos();
      $("conceptos").querySelector(`[data-key="${key}"] ${key === "otro" ? ".nota" : ".monto"}`).focus();
    };
  });
  actualizarHoja();
}

function actualizarHoja() {
  const inq = editando;
  $("fTotal").textContent = fmt(totalDe(inq));
  $("fWa").href = linkWa(textoInquilino(inq), inq.telefono);
  $("hojaTitulo").textContent = inq.nombre || "Inquilino";
  guardar();
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1800);
}

$("fNombre").oninput = e => { editando.nombre = e.target.value; actualizarHoja(); };
$("fTel").oninput = e => { editando.telefono = e.target.value; actualizarHoja(); };
$("fPagado").onchange = e => { registro(editando).pagado = e.target.checked; guardar(); };
$("fWa").onclick = e => {
  if (!telefonoWa(editando.telefono)) { e.preventDefault(); $("fTel").focus(); toast("Primero escribe su número de WhatsApp"); }
};
$("fBorrar").onclick = () => {
  const b = $("fBorrar");
  if (!b.classList.contains("confirm")) {
    b.classList.add("confirm");
    b.textContent = "Toca otra vez para eliminar";
    return;
  }
  const id = editando.id;
  db.inquilinos = db.inquilinos.filter(i => i.id !== id);
  Object.values(db.meses).forEach(m => delete m[id]);
  cerrar();
  toast("Inquilino eliminado");
};
$("cerrar").onclick = cerrar;
$("scrim").onclick = cerrar;
document.addEventListener("keydown", e => { if (e.key === "Escape" && editando) cerrar(); });

$("agregar").onclick = () => {
  const inq = { id: String(Date.now()), nombre: "", telefono: "", conceptos: ["alquiler", "luz", "agua"] };
  db.inquilinos.push(inq);
  abrir(inq);
  setTimeout(() => $("fNombre").focus(), 260);
};
$("prev").onclick = () => { mesKey = mover(mesKey, -1); render(); };
$("next").onclick = () => { mesKey = mover(mesKey, 1); render(); };
$("copiarMes").onclick = () => {
  const ant = db.meses[mover(mesKey, -1)];
  db.inquilinos.forEach(i => {
    if (ant[i.id]) db.meses[mesKey][i.id] = { montos: { ...ant[i.id].montos }, pagado: false };
  });
  render();
  toast("Montos copiados — ajusta luz y agua");
};

render();
bajar();

// Acceso directo: en Android sale el aviso del sistema; en iPhone se explican los pasos
const INSTALAR_KEY = STORE_KEY + "-sin-aviso-app";
let avisoInstalar = null;
const yaEsApp = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const esIphone = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let ocultoInstalar = false;
try { ocultoInstalar = !!localStorage.getItem(INSTALAR_KEY); } catch (e) {}
if (!yaEsApp && !ocultoInstalar && matchMedia("(pointer: coarse)").matches) $("instalar").hidden = false;

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); avisoInstalar = e; });
window.addEventListener("appinstalled", () => { $("instalar").hidden = true; toast("Listo, ya está en tu pantalla de inicio"); });

$("instalarBtn").onclick = async () => {
  if (avisoInstalar) {
    avisoInstalar.prompt();
    const { outcome } = await avisoInstalar.userChoice;
    avisoInstalar = null;
    if (outcome === "accepted") $("instalar").hidden = true;
    return;
  }
  $("pasos").innerHTML = esIphone
    ? `<ol><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (el cuadrito con la flecha ↑) abajo.</li><li>Elige <b>Agregar a inicio</b> y luego <b>Agregar</b>.</li></ol>`
    : `<ol><li>Toca los <b>tres puntitos ⋮</b> arriba a la derecha de Chrome.</li><li>Elige <b>Agregar a la pantalla principal</b> (o <b>Instalar app</b>).</li><li>Toca <b>Agregar</b>.</li></ol>`;
  $("pasos").hidden = !$("pasos").hidden;
};
$("instalarNo").onclick = () => {
  $("instalar").hidden = true;
  try { localStorage.setItem(INSTALAR_KEY, "1"); } catch (e) {}
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
